<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gabriel Mata Portfolio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #525659;
      overflow-x: hidden;
    }
    #pdf-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 0;
      gap: 12px;
    }
    canvas {
      display: block;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      max-width: 100%;
    }
    #loading {
      color: #ccc;
      font-family: sans-serif;
      font-size: 14px;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <div id="loading">Loading...</div>
  <div id="pdf-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
  <script type="module">
    import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs';

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';

    const container = document.getElementById('pdf-container');
    const loading = document.getElementById('loading');
    const PDF_URL = 'Gabriel_Mata_Portfolio.pdf';
    const SCALE = window.devicePixelRatio >= 2 ? 2.5 : 2;

    async function renderPDF() {
      const pdf = await pdfjsLib.getDocument(PDF_URL).promise;
      loading.remove();

      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const viewport = page.getViewport({ scale: SCALE });

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        canvas.style.width = Math.min(viewport.width, window.innerWidth - 32) + 'px';
        canvas.style.height = 'auto';

        container.appendChild(canvas);
        await page.render({ canvasContext: ctx, viewport }).promise;
      }
    }

    renderPDF().catch(err => {
      loading.textContent = 'Failed to load PDF.';
      console.error(err);
    });
  </script>
</body>
</html>
